<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Scale: Time</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" content="#050507">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"></noscript>
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="modulepreload" href="./src/data/timeline-data.js">
  <link rel="modulepreload" href="./src/data/climate-data.js">
  <link rel="modulepreload" href="./src/data/climate-metrics.js">
  <link rel="modulepreload" href="./src/lib/vertical-climate-view.js">
  <link rel="modulepreload" href="./src/lib/vertical-scale.js">
  <link rel="modulepreload" href="./src/lib/timeline-view-model.js">
  <link rel="modulepreload" href="./src/lib/time-scale.js">
  <link rel="modulepreload" href="./src/lib/search.js">
  <link rel="modulepreload" href="./src/lib/url-state.js">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <h1><button class="brand-toggle" type="button" id="brandToggle" aria-expanded="true">To Scale: Time</button></h1>
        <span class="subtitle">Build Temporal Intuition</span>
        <span class="search-count" id="searchCount"></span>
        <div class="mode-switch" role="group" aria-label="Experience mode">
          <button type="button" class="active" data-mode="timeline" aria-pressed="true">Timeline</button>
          <button type="button" data-mode="climate" aria-pressed="false">Climate</button>
        </div>
      </div>

      <div class="controls">
        <div class="input-row">
          <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search eras, periods, people, events, futures..." autocomplete="off">
            <div class="autocomplete-list" id="acList"></div>
          </div>
          <button class="btn" type="button" data-action="add">Add</button>
          <button class="btn secondary" type="button" data-action="clear">Clear all</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="climate-metric-controls" id="climateMetricControls" aria-label="Climate metrics"></div>
        <div class="presets" id="presetControls"></div>
      </div>
    </header>

    <main class="timeline-container" id="timelineContainer">
      <div class="empty">
        <div class="empty-big">Nothing selected yet</div>
        <small>Search above or try a preset.</small>
      </div>
    </main>
    </div>

  <div class="tooltip" id="tooltip"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
